<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Random Brand Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&family=Poppins:wght@500;600;700&display=swap">
<style>
/* Layout: control room. Top bar with brand + progress, side rail of brands and the 8 stages, main area switches between the map canvas, the roadmap board, the ready content and the brief form. */
:root {
  color-scheme: dark;
  --bg: #11141D; --panel: #191E2B; --panel-2: #212839; --line: #2D3550; --line-soft: #252C42;
  --fg: #EEF0F7; --muted: #9AA2BA; --brand: #8B53FE; --brand-soft: rgba(139,83,254,.18);
  --lime: #8DFE00; --lime-ink: #8DFE00; --on-lime: #1D2331; --warn: #FFB84D; --bad: #FF7A88;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
  --f-display: 'Lalezar', 'Tajawal', system-ui, sans-serif;
  --f-body: 'Tajawal', system-ui, 'Segoe UI', sans-serif;
  --f-num: 'Poppins', 'Tajawal', system-ui, sans-serif;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  color-scheme: light;
  --bg: #F5F3FA; --panel: #FFFFFF; --panel-2: #F0ECF8; --line: #DED8EE; --line-soft: #E9E4F4;
  --fg: #1D2331; --muted: #5B6275; --brand: #7A3FF5; --brand-soft: rgba(122,63,245,.12);
  --lime: #8DFE00; --lime-ink: #3B7A00; --on-lime: #1D2331; --warn: #B86E00; --bad: #C2283A;
  --shadow: 0 10px 30px rgba(40,20,90,.10);
} }
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #F5F3FA; --panel: #FFFFFF; --panel-2: #F0ECF8; --line: #DED8EE; --line-soft: #E9E4F4;
  --fg: #1D2331; --muted: #5B6275; --brand: #7A3FF5; --brand-soft: rgba(122,63,245,.12);
  --lime: #8DFE00; --lime-ink: #3B7A00; --on-lime: #1D2331; --warn: #B86E00; --bad: #C2283A;
  --shadow: 0 10px 30px rgba(40,20,90,.10);
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
#app { min-height: 100%; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-inline-start: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 24px; gap: 14px; }
.top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-size: 24px; line-height: 1; }
.logo i { width: 34px; height: 34px; border-radius: 10px; background: var(--brand); display: inline-flex; align-items: center; justify-content: center; font-style: normal; font-family: var(--f-num); font-weight: 700; color: #fff; font-size: 18px; box-shadow: 3px 3px 0 var(--lime); }
.logo small { font-family: var(--f-body); font-size: 13px; color: var(--muted); font-weight: 500; }
.prog { flex: 1; min-width: 220px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px; }
.prog b { font-size: 13px; color: var(--muted); font-weight: 700; white-space: nowrap; }
.bar { height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), var(--lime)); border-radius: 99px; transition: width .4s; }
.pct { font-family: var(--f-num); font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; min-width: 42px; text-align: end; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 8px 14px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover:not(:disabled) { border-color: var(--brand); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--lime); color: var(--on-lime); border-color: var(--lime); }
.btn.danger { color: var(--bad); }
.btn.ghost { background: transparent; }
.shell { flex: 1; display: grid; grid-template-columns: 280px 1fr; gap: 14px; min-height: 0; }
@media (max-width: 860px) { .shell { grid-template-columns: 1fr; } }
.rail { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; min-width: 0; }
.box h3 { margin: 0 0 10px; font-size: 13px; color: var(--muted); font-weight: 800; letter-spacing: .3px; display: flex; justify-content: space-between; align-items: center; }
.brands { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow: auto; }
.brandrow { text-align: start; border: 1px solid transparent; background: transparent; border-radius: 12px; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.brandrow:hover { background: var(--panel-2); }
.brandrow.on { background: var(--brand-soft); border-color: var(--brand); }
.brandrow .n { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brandrow .s { font-size: 12px; color: var(--muted); }
.tag { font-size: 11px; font-weight: 800; padding: 1px 8px; border-radius: 99px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.tag.ex { background: rgba(255,184,77,.16); color: var(--warn); }
.stages { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.stages button { width: 100%; text-align: start; background: transparent; border: 0; border-radius: 10px; padding: 7px 8px; display: flex; align-items: center; gap: 10px; }
.stages button:hover { background: var(--panel-2); }
.dot { flex: none; width: 24px; height: 24px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-family: var(--f-num); font-size: 12px; font-weight: 700; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
.dot.done { background: var(--lime); color: var(--on-lime); border-color: var(--lime); }
.dot.running { background: var(--brand); color: #fff; border-color: var(--brand); animation: pulse 1.2s infinite; }
.dot.error { background: var(--bad); color: #fff; border-color: var(--bad); }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px var(--brand-soft); } }
@media (prefers-reduced-motion: reduce) { .dot.running, .node.running { animation: none; } .bar > span { transition: none; } }
.main { min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 6px 16px; font-weight: 800; font-size: 14px; }
.tabs button[aria-selected="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
.note { font-size: 13px; color: var(--muted); }
.note.warn { color: var(--warn); }
.status { min-height: 22px; font-size: 13px; color: var(--muted); }
/* map */
.mapwrap { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: auto; background-image: radial-gradient(var(--line-soft) 1.2px, transparent 1.3px); background-size: 22px 22px; }
.mapzoom { position: sticky; top: 0; right: 0; z-index: 3; display: flex; gap: 6px; padding: 10px 10px 0; justify-content: flex-end; pointer-events: none; }
.mapzoom .btn { pointer-events: auto; padding: 4px 12px; }
.sizer { position: relative; }
.map { position: absolute; top: 0; right: 0; transform-origin: top right; }
.map svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.node { position: absolute; width: 320px; height: 252px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; text-align: start; overflow: hidden; box-shadow: var(--shadow); }
.node:hover { border-color: var(--brand); }
.node.done { border-color: color-mix(in srgb, var(--lime) 55%, var(--line)); }
.node.running { border-color: var(--brand); animation: pulse 1.2s infinite; }
.node.error { border-color: var(--bad); }
.node.core { background: var(--brand); color: #fff; border-color: var(--brand); }
.node.core .nk, .node.core .nmeta { color: rgba(255,255,255,.8); }
.nhead { display: flex; align-items: center; gap: 10px; }
.nk { font-size: 12px; color: var(--muted); font-weight: 800; }
.nt { font-weight: 800; font-size: 16px; line-height: 1.3; }
.nbody { flex: 1; min-height: 0; overflow: hidden; font-size: 13.5px; line-height: 1.6; display: flex; flex-direction: column; gap: 6px; -webkit-mask-image: linear-gradient(#000 78%, transparent); mask-image: linear-gradient(#000 78%, transparent); }
.nbody p { margin: 0; }
.nmeta { font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 800; padding: 2px 10px; border-radius: 99px; background: var(--brand-soft); color: var(--fg); border: 1px solid var(--line); }
.chip.lime { background: var(--lime); color: var(--on-lime); border-color: var(--lime); }
.chip.no { text-decoration: line-through; color: var(--muted); }
.sw { display: flex; gap: 6px; }
.sw i { flex: 1; height: 40px; border-radius: 10px; border: 1px solid var(--line); }
.mini-quad { position: relative; height: 110px; border-radius: 12px; border: 1px solid var(--line); background: linear-gradient(var(--line), var(--line)) center/1px 100% no-repeat, linear-gradient(var(--line), var(--line)) center/100% 1px no-repeat; direction: ltr; }
.mini-quad span { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); transform: translate(-50%, 50%); }
.mini-quad span.self { width: 16px; height: 16px; background: var(--lime); box-shadow: 0 0 0 4px var(--brand-soft); }
.pill-bars { display: flex; flex-direction: column; gap: 5px; }
.pill-bars div { display: grid; grid-template-columns: 1fr 90px 34px; gap: 8px; align-items: center; font-size: 12.5px; }
.pill-bars em { font-style: normal; font-family: var(--f-num); font-weight: 700; font-size: 12px; text-align: end; }
.pill-bars i { height: 6px; border-radius: 9px; background: var(--panel); overflow: hidden; display: block; }
.pill-bars i b { display: block; height: 100%; background: var(--brand); }
.nfoot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.nfoot .btn { padding: 4px 10px; font-size: 12.5px; }
/* roadmap */
.road { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1100px) { .road { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .road { grid-template-columns: 1fr; } }
.phase { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.phase .wk { font-family: var(--f-num); font-size: 12px; font-weight: 700; color: var(--on-lime); background: var(--lime); padding: 1px 10px; border-radius: 99px; align-self: flex-start; }
.phase h4 { margin: 0; font-size: 17px; font-weight: 800; text-wrap: balance; }
.phase .goal { font-size: 13px; color: var(--muted); margin: 0; }
.task { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: start; padding: 8px 10px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line-soft); }
.task input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--brand); }
.task label { font-size: 14px; line-height: 1.5; cursor: pointer; }
.task.done label { color: var(--muted); text-decoration: line-through; }
.owner { font-size: 11px; font-weight: 800; padding: 1px 8px; border-radius: 99px; background: var(--brand-soft); white-space: nowrap; }
.owner.client { background: rgba(255,184,77,.16); color: var(--warn); }
/* brief form */
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 700px) { .form { grid-template-columns: 1fr; } }
fieldset { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); padding: 12px 14px 14px; margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
legend { font-family: var(--f-display); font-size: 20px; padding: 0 6px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 13px; font-weight: 800; color: var(--muted); }
.field label b { color: var(--bad); }
.field input, .field textarea, .field select { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 14.5px; }
.field textarea { min-height: 64px; resize: vertical; line-height: 1.6; }
/* drawer */
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(560px, 100%); z-index: 20; background: var(--panel); border-right: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; padding: calc(14px + env(safe-area-inset-top, 0px)) 18px calc(14px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); gap: 12px; }
.drawer header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.drawer h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; }
.dbody { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 12px; padding-left: 4px; }
.kv { background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 14px; padding: 10px 12px; }
.kv > b { display: block; font-size: 12.5px; color: var(--lime-ink); font-weight: 800; margin-bottom: 4px; }
.kv p { margin: 0; }
.kv ul { margin: 0; padding-inline-start: 18px; }
.kv .kv { margin-top: 8px; background: var(--panel); }
.src { font-size: 11px; font-weight: 800; padding: 0 7px; border-radius: 99px; margin-inline-start: 6px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
.regen { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.regen textarea { width: 100%; min-height: 60px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.empty { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; background: var(--panel); border: 1px dashed var(--line); border-radius: 18px; padding: 28px; }
.empty h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 32px; line-height: 1.2; }
.empty p { margin: 0; color: var(--muted); max-width: 60ch; }
.steps8 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; width: 100%; }
@media (max-width: 700px) { .steps8 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.steps8 div { background: var(--panel-2); border-radius: 12px; padding: 8px 10px; font-size: 13px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
.cwrap { display: flex; flex-direction: column; gap: 12px; }
.csec { display: flex; flex-direction: column; gap: 10px; }
.csec > h3 { font-size: 17px; color: var(--fg); font-family: var(--f-display); font-weight: 400; letter-spacing: 0; margin: 0; }
.lead2 { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.7; }
.sliders { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.hl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
@media (max-width: 700px) { .sliders, .two-col { grid-template-columns: 1fr; } }
.sl-l { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; }
.sl-track { position: relative; height: 8px; border-radius: 9px; background: var(--panel-2); margin: 8px 0 6px; }
.sl-track i { position: absolute; top: 50%; width: 16px; height: 16px; border-radius: 50%; background: var(--lime); border: 2px solid var(--brand); transform: translate(50%, -50%); }
.pcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.pcard { background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ph { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.hook { font-weight: 800; font-size: 15px; margin: 0; }
.cap { white-space: pre-wrap; margin: 0; font-size: 14px; line-height: 1.7; background: var(--panel); border: 1px solid var(--line-soft); border-radius: 10px; padding: 8px 10px; overflow-wrap: anywhere; }
.btn.copy { padding: 2px 10px; font-size: 12px; border-radius: 9px; }
.qa { display: flex; flex-direction: column; gap: 8px; }
.qa > div { background: var(--panel-2); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.shots { margin: 0; padding-inline-start: 20px; font-size: 13.5px; }
.shots li { margin-bottom: 6px; }
/* user and generated text follows its own language inside either interface direction */
.nbody p, .cap, .kv p, .kv li, .hook, .lead2, .brandrow .n, .brandrow .s, .phase h4, .phase .goal, .task label, .pcard p, .shots li, .nt, .field input, .field textarea { unicode-bidi: plaintext; text-align: start; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--panel-2); border: 1px solid var(--warn); border-radius: 12px; padding: 8px 12px; font-size: 13.5px; }
</style>

<div id="app" dir="rtl" lang="ar">
  <div class="top">
    <div class="logo"><i>R</i><div>Brand Studio<br><small>محرك استراتيجية Random</small></div></div>
    <div class="prog" id="prog"><b>معدل إنجاز الخطة</b><div class="bar"><span id="progbar" style="width:0%"></span></div><span class="pct" id="progpct">0%</span></div>
    <div class="actions"><button class="btn" id="langBtn" type="button" lang="en">English</button></div>
    <div class="actions" id="topactions"></div>
  </div>
  <div class="shell">
    <aside class="rail">
      <section class="box"><h3><span>البراندات</span><button class="btn ghost" id="newBrandBtn" type="button">+ جديد</button></h3><div class="brands" id="brands"></div></section>
      <section class="box"><h3><span>مراحل المحرك</span><span class="pct" id="stagepct">0/12</span></h3><ol class="stages" id="stages"></ol></section>
    </aside>
    <main class="main">
      <div class="tabs" role="tablist" id="tabs">
        <button role="tab" data-tab="map" aria-selected="true" type="button">خريطة البراند</button>
        <button role="tab" data-tab="road" aria-selected="false" type="button">الرود ماب</button>
        <button role="tab" data-tab="content" aria-selected="false" type="button">المحتوى</button>
        <button role="tab" data-tab="brief" aria-selected="false" type="button">بيانات البراند</button>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
      <div id="view"></div>
    </main>
  </div>
</div>

<script>
(() => {
  'use strict';
  // ---------- language: interface follows the toggle, generated content follows each brand's own language ----------
  let LANG = 'ar';

  // later stages read only what they need, to keep the prompt short

      else el.setAttribute(k, v === true ? '' : v);

  }

  // ---------- local store (outside claude.ai) ----------
  function localDb() {
    const KEY = 'rbs.brands';
    const read = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } };
    const write = (all) => { try { localStorage.setItem(KEY, JSON.stringify(all)); return true; } catch (e) { return false; } };
    const subs = [];
    const emit = () => { const all = read(); const docs = Object.keys(all).map(id => ({ id, exists: true, data: () => JSON.parse(JSON.stringify(all[id])) })); setTimeout(() => subs.forEach(f => f({ docs, metadata: { fromCache: false, hasPendingWrites: false } })), 0); };
    const merge = (a, b) => { for (const k in b) { if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) merge(a[k], b[k]); else a[k] = b[k]; } return a; };
    const fail = () => Promise.reject({ code: 'quota_exceeded' });

      collection: () => ({ onSnapshot: (f) => { subs.push(f); emit(); return () => {}; }, doc: (id) => api.doc('brands/' + id) }),
      doc: (path) => {
        const id = path.split('/')[1];

          set: (d) => { const all = read(); all[id] = JSON.parse(JSON.stringify(d)); if (!write(all)) return fail(); emit(); return Promise.resolve(); },
          update: (d) => { const all = read(); if (!all[id]) return Promise.reject({ code: 'invalid_argument' }); merge(all[id], JSON.parse(JSON.stringify(d))); if (!write(all)) return fail(); emit(); return Promise.resolve(); },
          delete: () => { const all = read(); delete all[id]; write(all); emit(); return Promise.resolve(); },
        };

      dump: () => read(),
      load: (obj) => { const all = Object.assign(read(), obj); const ok = write(all); emit(); return ok; },

  function promptFor(b, sid, note) {

${JSON.stringify(earlierOf(b, sid))}

${typeof TASKS[sid] === 'function' ? TASKS[sid](b.brief || {}) : TASKS[sid]}${note ? `\n\nEXTRA INSTRUCTION FROM THE AGENCY: ${note}` : ''}`;

    return need.every(k => d[k] != null);

  async function runStage(b, sid, note) {

.swatch > small { display: block; font-size: 25px; opacity: .75; }
.pillar .share { font-size: 76px; color: var(--lime); line-height: 1; margin-bottom: 12px; }
.pillar .share .en { font-weight: 800; }
.pillar p { margin-bottom: 18px; }
.hook { margin-top: auto; font-size: 26px; padding: 14px 20px 10px; border-radius: 18px; background: rgba(139,83,254,.3); border: 2px solid rgba(255,255,255,.15); line-height: 1.45; }
.weeks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; margin-top: 30px; }
.wk { position: relative; padding-top: 62px; }
.wk .w { position: absolute; top: 0; right: 42px; background: var(--lime); color: var(--navy); font-weight: 800; font-size: 28px; padding: 10px 26px 6px; border-radius: 999px; border: 4px solid var(--navy); box-shadow: 5px 5px 0 var(--purple); transform: translateY(-40%) rotate(-3deg); }
.steps { display: flex; flex-direction: column; gap: 22px; }
.step { display: flex; align-items: center; gap: 26px; font-size: 42px; font-weight: 700; }
.purple .badge { box-shadow: 5px 5px 0 var(--navy); }
.contact { display: flex; gap: 30px; flex-wrap: wrap; margin-top: 46px; }
.slogan { font-family: 'Poppins'; font-weight: 800; font-size: 56px; direction: ltr; text-align: right; margin-top: 34px; }
.uline { position: relative; display: inline-block; }

    navy(L.dd, `${two(VI.rules_headline || L.dd_h)}
      <div class="ba"><div class="card after"><div class="lbl">${L.do}</div>${li(VI.do)}</div><div class="card before"><div class="lbl off">${L.dont}</div>${li(VI.dont)}</div></div>`);
    const pillars = arr(S.content.pillars).slice(0, 4);
    navy(L.content, `${two(S.content.headline || L.content_h)}
      <div class="cards c${Math.max(1, pillars.length)}">${pillars.map(p => `<div class="card pillar"><div class="share">${en((+p.share || 0) + '%')}</div><h3>${t(p.name)}</h3><p>${t(p.what)}</p><div class="hook">${L.example}${L.q1}${t(p.hook)}${L.q2}</div></div>`).join('')}</div>`);
    navy(L.plan, `${two(S.plan.headline || L.plan_h)}
      <div class="weeks">${arr(S.plan.weeks).slice(0, 4).map((w, i) => `<div class="card wk"><span class="w">${L.week}${i + 1}</span><h3>${t(w.title)}</h3>${li(w.items)}</div>`).join('')}</div>`);
    slides.push({ kind: 'next' });
    const N = slides.length;
    const num = (i) => `${String(i + 1).padStart(2, '0')} / ${String(N).padStart(2, '0')}`;
    const html = slides.map((s, i) => {
      if (s.kind === 'cover') return `<section class="slide purple">
  <div class="glow" style="width:760px;height:760px;background:rgba(141,254,0,.22);bottom:-320px;left:-260px"></div><div class="wm">RANDOM</div>
  <div class="top"><span class="pill lime">${b.example ? L.demo_pill : L.cover_pill}</span><img class="logo" src="${DECK_LOGO}" style="height:120px" alt="Random"></div>
  <div class="body"><div class="h1">${L.cover_h1}</div><div class="h1 limeT uline" style="align-self:flex-start">${t(brand)}</div><div class="sub" style="margin-top:60px">${L.tagline}</div></div>
  <div class="foot"><span>Prepared by Random Agency · ${e(today())}</span><span>${e(footR)}</span></div></section>`;
      if (s.kind === 'next') return `<section class="slide purple">
  <div class="glow" style="width:760px;height:760px;background:rgba(141,254,0,.2);top:-320px;left:-260px"></div><div class="wm">RANDOM</div>
  <div class="top"><span class="pill lime">${L.next}</span><img class="logo" src="${DECK_LOGO}" alt="Random"></div>
  <div class="body">${two(S.next.headline || L.next_h, 'h1 sm')}
    <div class="steps">${arr(S.next.steps).map((x, j) => `<div class="step"><span class="badge">${j + 1}</span><span>${t(x)}</span></div>`).join('')}</div>
    <div class="contact"><span class="chip lime">${L.whatsapp} <span class="en">01041972524</span></span><span class="chip en">randomagency09@gmail.com</span><span class="chip en">@random_agency_</span></div>
    <div class="slogan">Stop Random. <span class="limeT">Start Growth.</span></div></div>
  <div class="foot"><span>${e(footL)}</span><span>${num(i)}</span></div></section>`;
      return `<section class="slide navy"><div class="grid"></div>${glows[i % glows.length]}
  <div class="top"><span class="pill${s.lime ? ' lime' : ''}">${s.pill}</span><span class="en" style="opacity:.6;font-size:26px">${num(i)}</span></div>
  <div class="body">${s.body}</div>
  <div class="foot"><span>${e(footL)}</span><span>${e(footR)}</span></div></section>`;
    }).join('\n');
    const ltr = lg === 'en' ? `
html[dir="ltr"] .card ul li { padding-right: 0; padding-left: 34px; }
html[dir="ltr"] .card li:before { right: auto; left: 0; }
html[dir="ltr"] .slogan { text-align: left; }
html[dir="ltr"] .wm { left: auto; right: -40px; transform: rotate(6deg); }
html[dir="ltr"] .uline:after { left: -1%; right: -1%; }` : '';
    const ui = `
.bar-ui { position: fixed; inset: 0 0 auto; z-index: 99; display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; padding: 12px 16px; background: #1D2331; color: #fff; font: 600 15px Tajawal, system-ui, sans-serif; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
.bar-ui button { font: 800 15px Tajawal, system-ui, sans-serif; background: #8DFE00; color: #1D2331; border: 0; border-radius: 10px; padding: 8px 18px; cursor: pointer; }
@media screen { html, body { width: auto; background: #0d1018; } body { padding-top: 70px; } .deck { zoom: var(--z, 1); } .slide { margin: 0 auto 24px; box-shadow: 0 10px 40px rgba(0,0,0,.4); } }
@media print { .bar-ui { display: none; } body { padding: 0 !important; } .deck { zoom: 1 !important; } .slide { margin: 0; box-shadow: none; } }`;
    const script = `<script>
(function () {
  var fit = function () { document.querySelector('.deck').style.setProperty('--z', Math.min(1, (window.innerWidth - 32) / 1920)); };
  fit(); window.addEventListener('resize', fit);
  document.getElementById('printBtn').addEventListener('click', function () { window.print(); });
  if (location.hash === '#print') { (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () { setTimeout(function () { window.print(); }, 500); }); }
})();
<\/script>`;
    return `<!doctype html>
<html lang="${lg}" dir="${lg === 'en' ? 'ltr' : 'rtl'}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${e(brand)} · ${lg === 'en' ? 'Brand strategy' : 'استراتيجية البراند'} | Random Agency</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&family=Poppins:wght@500;600;700;800&display=block">
<style>${DECK_CSS}${ltr}${ui}</style>
</head>
<body>
<div class="bar-ui"><button id="printBtn" type="button">${L.print}</button><span>${L.hint}</span></div>
<main class="deck">${html}</main>
${script}
</body>
</html>`;
  }
  async function printDeck(b) {
    const html = deckHTML(b);
    const fname = ((str(b.brief && b.brief.name_en) || 'brand').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'brand') + '-strategy.html';
    if (LOCAL) {
      const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
      const w = window.open(url + '#print', '_blank');
      if (!w) { saveFile(fname, html, 'text/html'); setStatus(T('المتصفح منع فتح نافذة جديدة، فالبريزنتيشن اتحمّل كملف. افتحه واطبعه.')); }
      else setStatus(T('البريزنتيشن اتفتح في تاب جديد. اختار Save as PDF في نافذة الطباعة.'));
      setTimeout(() => URL.revokeObjectURL(url), 120000);
      return;
    }
    if (downloads) {
      try { await downloads.save({ filename: fname, data: html }); setStatus(T('البريزنتيشن اتحمّل. افتح الملف واضغط «اطبع أو احفظ PDF».')); return; }
      catch (err) { if (err && err.code === 'declined') return; }
    }
    setStatus(T('مقدرتش أحفظ أو أنسخ هنا.'));
  }
  if (typeof window !== 'undefined') window.rbsDeck = (id) => { const b = brands.find(x => x.id === id); return b ? deckHTML(b) : ''; };

  // ----- roadmap -----
  function roadView(b) {
    const d = stageOf(b, 's8').data;
    if (!d || !arr(d.roadmap).length) return h('div', { class: 'empty' }, h('h2', null, T('الرود ماب لسه ما اتعملتش')), h('p', null, T('بتطلع من المرحلة التامنة بعد ما المحرك يخلّص. شغّل المحرك من فوق.')));
    const tasks = tasksOf(b);
    const done = tasks.filter(t => b.done && b.done[t.key]).length;
    const wrap = h('div', { style: 'display:flex;flex-direction:column;gap:12px' });
    wrap.append(h('div', { class: 'box', style: 'display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between' },
      h('div', null, h('div', { style: 'font-family:var(--f-display);font-size:24px' }, two(d.summary && d.summary.headline) || T('الخطة')), h('div', { class: 'note' }, str(d.summary && d.summary.direction))),
      h('div', { class: 'chips' }, h('span', { class: 'chip lime' }, (EN_UI ? `${done}/${tasks.length} tasks` : `${done}/${tasks.length} مهمة`)), h('span', { class: 'chip' }, T('90 يوم')))));
    const road = h('div', { class: 'road' });
    arr(d.roadmap).forEach((p, pi) => {
      const col = h('section', { class: 'phase' }, h('span', { class: 'wk' }, T('أسبوع '), h('bdi', { dir: 'ltr' }, str(p.weeks))), h('h4', null, str(p.phase)), h('p', { class: 'goal' }, str(p.goal)));
      arr(p.tasks).forEach((tk, ti) => {
        const key = `p${pi}t${ti}`;
        const isDone = !!(b.done && b.done[key]);
        const id = `t-${b.id}-${key}`;
        const cb = h('input', { type: 'checkbox', id, disabled: !canWrite });
        cb.checked = isDone;
        cb.addEventListener('change', () => { b.done = Object.assign({}, b.done, { [key]: cb.checked }); save(b.id, { done: { [key]: cb.checked } }); render(); });
        const client = /عميل|client/i.test(str(tk.owner));
        col.append(h('div', { class: 'task' + (isDone ? ' done' : '') }, cb, h('label', { for: id }, str(tk.title)), h('span', { class: 'owner' + (client ? ' client' : '') }, client ? T('العميل') : 'Random')));
      });
      road.append(col);
    });
    wrap.append(road);
    if (arr(d.next && d.next.steps).length) wrap.append(h('div', { class: 'box' }, h('h3', null, h('span', null, T('الخطوة الجاية مع العميل'))), h('ol', { style: 'margin:0;padding-inline-start:20px' }, arr(d.next.steps).map(s => h('li', null, str(s))))));
    return wrap;
  }

  // ----- drawer -----
  const LABELS = { one_liner: T('في سطرين'), facts: T('اللي نعرفه'), gaps: T('أسئلة للعميل'), claim: T('المعلومة'), jobs: T('الزبون بيشتري إيه'), audience: T('الجمهور'), functional: T('عايز يخلّص إيه'), emotional: T('عايز يحس بإيه'), social: T('عايز يبان إزاي'), text: T('النص'), evidence: T('الدليل'), ideal: T('زبوننا'), not: T('مش لينا'), name: T('الاسم'), points: T('النقط'), market: T('السوق'), competitors: T('المنافسين'), does: T('بيقدم نفسه'), gap: T('الناقص'), pattern: T('اللي بيتكرر'), whitespace: T('المكان الفاضي'), position: T('التمركز'), statement: T('جملة التمركز'), only: T('اللي محدش غيرنا بيقوله'), axes: T('المحاور'), personality: T('الشخصية'), archetype: T('النموذج'), archetype_note: T('وصفه'), if_person: T('لو شخص'), words: T('3 كلمات'), never: T('الكلمة الممنوعة'), voice: T('الصوت'), pairs: T('مبنقولش / بنقول'), no: T('مبنقولش'), yes: T('بنقول'), rules: T('قواعد'), visual: T('البصري'), colors: T('الألوان'), type: T('الخط'), shapes: T('الأشكال'), photo: T('التصوير'), do: T('بنعمل'), dont: T('مبنعملش'), art_brief: T('بريف الآرت دايركتور'), prompts: T('برومبتات المود بورد'), use: T('الاستخدام'), prompt: T('البرومبت'), content: T('المحتوى'), pillars: T('المحاور'), share: T('النسبة'), what: T('إيه'), hook: T('مثال هوك'), plan: T('أول 30 يوم'), weeks: T('الأسابيع'), title: T('العنوان'), items: T('البنود'), summary: T('الخلاصة'), problem: T('المشكلة'), opportunity: T('الفرصة'), direction: T('الاتجاه'), next: T('الخطوة الجاية'), steps: T('الخطوات'), roadmap: T('الرود ماب'), phase: T('المرحلة'), goal: T('الهدف'), tasks: T('المهام'), owner: T('مين'), offer: T('الباقة المقترحة (للمالك بس)'), package: T('الباقة'), why: T('ليه'), open_questions: T('أسئلة مفتوحة'), hex: T('الكود'), role: T('الدور'), rules_headline: T('عنوان القواعد'), x: T('الأفقي'), y: T('الرأسي') };
  function renderValue(v, key) {
    if (v == null || v === '') return null;
    if (key === 'headline' || key === 'rules_headline') return h('p', null, h('b', null, two(v)));
    if (Array.isArray(v)) {
      if (v.every(x => typeof x !== 'object')) return h('ul', null, v.map(x => h('li', null, str(x))));
      return h('div', null, v.map(x => {
        if (x && x.claim) return h('div', { class: 'kv' }, h('p', null, str(x.claim), h('span', { class: 'src' }, SRC[x.src] || str(x.src))));
        if (x && x.hex) return h('div', { class: 'kv', style: 'display:flex;gap:10px;align-items:center' }, h('i', { style: `width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:${hex(x.hex)};flex:none` }), h('p', null, h('b', null, str(x.name)), ' · ', str(x.role), ' · ', h('span', { style: 'font-family:var(--f-num)' }, str(x.hex))));
        return h('div', { class: 'kv' }, Object.entries(x || {}).map(([k, val]) => kvRow(k, val)));
      }));
    }
    if (typeof v === 'object') return h('div', null, Object.entries(v).map(([k, val]) => kvRow(k, val)));
    if (typeof v === 'boolean') return h('p', null, v ? T('آه') : T('لأ'));
    return h('p', null, str(v));
  }
  function kvRow(k, v) {
    if (k === 'self') return null;
    const inner = renderValue(v, k);
    if (!inner) return null;
    if (k === 'headline') return inner;
    return h('div', { class: 'kv' }, h('b', null, LABELS[k] || k), inner);
  }
  let drawerEl = null;
  function renderDrawer(b) {
    if (drawerEl) { drawerEl.remove(); drawerEl = null; }
    if (!b || !drawerStage) return;
    const s = STAGES.find(x => x.id === drawerStage);
    const st = stageOf(b, s.id);
    const status = stageStatus(b, s.id);
    const idx = STAGES.indexOf(s);
    const prevDone = STAGES.slice(0, idx).every(x => stageOf(b, x.id).status === 'done');
    const note = h('textarea', { id: 'regen-note', placeholder: T('ملاحظة للمحرك (اختياري): مثلًا «الزبون الأساسي ستات مش عائلات»') });
    const body = h('div', { class: 'dbody' });
    if (st.status === 'done' && st.data) Object.entries(st.data).forEach(([k, v]) => { const r = kvRow(k, v); if (r) body.append(r); });
    else body.append(h('p', { class: 'note' }, status === 'running' ? T('بيشتغل دلوقتي...') : T('المرحلة دي لسه ما اتعملتش.')));
    drawerEl = h('aside', { class: 'drawer', role: 'dialog', 'aria-label': s.name },
      h('header', null, h('div', null, h('div', { class: 'nk' }, (EN_UI ? `Stage ${idx + 1} of ${STAGES.length}` : `المرحلة ${idx + 1} من ${STAGES.length}`)), h('h2', null, s.name)),
        h('button', { class: 'btn', type: 'button', onclick: () => { drawerStage = null; render(); } }, T('اقفل'))),
      body,
      h('div', { class: 'regen' },
        h('label', { for: 'regen-note', class: 'note' }, st.status === 'done' ? T('مش عاجبك؟ ولّدها تاني بملاحظة. المراحل اللي بعدها بتفضل زي ما هي لحد ما تولّدها.') : T('المرحلة دي محتاجة اللي قبلها يخلص الأول.')),
        note,
        h('div', { class: 'actions' },
          h('button', { class: 'btn primary', type: 'button', disabled: !canWrite || !!running || !prevDone, onclick: () => runStage(b, s.id, note.value.trim()) }, st.status === 'done' ? T('ولّدها تاني') : T('ولّد المرحلة دي')))));
    document.getElementById('app').append(drawerEl);
  }

  // ---------- events ----------
  $('tabs').addEventListener('click', (e) => { const bt = e.target.closest('button[data-tab]'); if (!bt) return; if (tab === 'brief' && current()) flushBrief(current().id); tab = bt.dataset.tab; drawerStage = null; remember(); render(); });
  $('newBrandBtn').addEventListener('click', () => newBrand());
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && (drawerStage || manual)) { drawerStage = null; manual = null; render(); } });
  window.addEventListener('resize', () => { if (tab === 'map' && !zoom) render(); });

  // ---------- boot ----------
  const appEl = document.getElementById('app');
  appEl.dir = EN_UI ? 'ltr' : 'rtl';
  appEl.lang = EN_UI ? 'en' : 'ar';
  translateStatic();
  const langBtn = $('langBtn');
  langBtn.textContent = EN_UI ? 'عربي' : 'English';
  langBtn.lang = EN_UI ? 'ar' : 'en';
  langBtn.addEventListener('click', async () => {
    if (current() && tab === 'brief') { try { await flushBrief(current().id); } catch (e) {} }
    const next = EN_UI ? 'ar' : 'en';
    try { localStorage.setItem('rbs.lang', next); } catch (e) {}
    location.hash = next;
    location.reload();
  });
  render();
  (async () => {
    const c = window.claude;
    if (c && typeof c.use === 'function') {
      const [d, s, dl, u] = await Promise.all(['db', 'sample', 'downloads', 'user'].map(n => c.use(n).catch(() => null)));
      db = d; sample = s; downloads = dl; user = u;
      if (user && typeof user.can === 'function') { try { const w = await user.can('data.write'); if (w === false) canWrite = false; } catch (e) {} }
    }
    if (!db) { db = localDb(); LOCAL = true; canWrite = true; }
    let timer = setTimeout(() => { if (!loaded) { loaded = true; setStatus(T('البيانات مش واصلة لسه. ممكن تكون قديمة.')); render(); } }, 10000);
    db.collection('brands').onSnapshot((snap) => {
      brands = snap.docs.filter(x => x.exists).map(x => Object.assign({ id: x.id }, x.data()));
      if (!snap.metadata.fromCache) { clearTimeout(timer); if (!loaded) setStatus(''); }
      loaded = true;
      if (currentId && !brands.find(b => b.id === currentId)) currentId = null;
      if (!currentId && brands.length) currentId = [...brands].sort((x, y) => str(y.updatedAt).localeCompare(str(x.updatedAt)))[0].id;
      render();
    }, () => { clearTimeout(timer); loaded = true; setStatus(T('مقدرتش أوصل للبيانات.')); render(); });
  })();
})();
</script>
